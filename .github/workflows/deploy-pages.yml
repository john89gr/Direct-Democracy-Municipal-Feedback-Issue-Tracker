name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: `npm run build:frontend -- --base-href …` does NOT work — the
      # flag is swallowed by the nested `npm run` in the root script and
      # arrives at `ng build` as a positional project name. Invoke the
      # workspace script directly so `--` forwards it to `ng build`.
      - name: Build Angular
        run: |
          npm run build --workspace=apps/frontend -- \
            --base-href /Direct-Democracy-Municipal-Feedback-Issue-Tracker/

      - name: Prepare Pages
        run: |
          mkdir -p public
          cp -r apps/frontend/dist/browser/. public/
          cp public/index.html public/404.html
          touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
